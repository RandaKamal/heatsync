[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.0.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.3.260530",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "torch>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebooks"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "behave>=1.3.3",
    "coverage>=7.14.1",
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "mutmut>=3.6.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "PL",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal expected values; magic-value checks add noise here.
"**/tests/**" = ["PLR2004"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["."]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = false
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    "\\.venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
addopts = "-q -p no:launch_testing -p no:launch_ros"
python_files = [
    "test_*.py",
    "*_test.py",
]
testpaths = [
    "tests",
]
pythonpath = [
    "..",
    ".",
]

[tool.coverage.run]
branch = true
source = [
    ".",
]
omit = [
    "test_*.py",
    "*_test.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
