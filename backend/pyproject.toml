[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.14.1",
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "mutmut>=3.6.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "PL",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "PLR0913",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["."]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    "\\.venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
addopts = "-q"
python_files = [
    "test_*.py",
    "*_test.py",
]
testpaths = [
    ".",
]

[tool.coverage.run]
branch = true
source = [
    ".",
]
omit = [
    "test_*.py",
    "*_test.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
